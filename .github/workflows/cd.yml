name: CD
on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - master
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  actions: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          workflow_conclusion: success
          name: etsecure-dist
          path: dist/apps/
          github_token: ${{secrets.GITHUB_TOKEN}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend Docker metadata
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/etsecure_backend

      - name: Extract frontend Docker metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/etsecure_frontend

      - name: Check if backend build exists
        id: has_backend
        run: |
          if [ -d dist/apps/backend ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Check if frontend build exists
        id: has_frontend
        run: |
          if [ -d dist/apps/frontend ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build Docker frontend image via Nx
        if: steps.has_backend.outputs.exists == 'true'
        run: npx nx run frontend:docker-build

      - name: Publish Docker frontend image via Nx
        if: steps.has_backend.outputs.exists == 'true'
        run: npx nx run frontend:docker-publish

      - name: Build Docker frontend image via Nx
        if: steps.has_frontend.outputs.exists == 'true'
        run: npx nx run frontend:docker-build

      - name: Publish Docker frontend image via Nx
        if: steps.has_frontend.outputs.exists == 'true'
        run: npx nx run frontend:docker-publish