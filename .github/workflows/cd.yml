name: CD
on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - master
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  actions: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NX_BRANCH: ${{ github.head_ref || github.ref_name }}
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          workflow_conclusion: success
          name: etsecure-dist
          path: .
          github_token: ${{secrets.GITHUB_TOKEN}}

      - name: Setup Node and install deps
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend Docker metadata
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/etsecure_backend

      - name: Extract frontend Docker metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/etsecure_frontend

      - name: Get affected projects
        id: affected
        run: |
          echo "AFFECTED=\"$(npx nx show projects --affected --base=origin/master~5 --head=origin/master | grep -E 'frontend|backend' | tr '\n' ' ' | xargs)\"" >> $GITHUB_ENV

      - name: Docker build affected projects
        run: npx nx run-many -t docker-build --projects=$AFFECTED

      - name: Publish Docker image via Nx
        run: npx nx run-many -t docker-publish --projects=$AFFECTED

