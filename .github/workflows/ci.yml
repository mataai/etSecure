name: CI
on:
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/workflows/merge.yml
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/workflows/merge.yml
permissions:
  contents: read
  actions: read
env:
  NX_BRANCH: ${{ github.head_ref || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - uses: nrwl/nx-set-shas@v4

      - name: Show affected projects
        run: npx nx show projects --affected

      - run: npx nx affected -t lint test build --base=origin/master~5 --head=origin/master

      - name: Run copy-project-json on affected projects
        run: npx nx affected -t copy-project-json --base=origin/master~5 --head=origin/master

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etsecure-dist
          path: dist/apps/
