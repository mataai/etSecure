name: CI
on:
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/workflows/merge.yml
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/workflows/merge.yml
permissions:
  contents: read
  actions: read
env:
  NX_BRANCH: ${{ github.head_ref || github.ref_name }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - uses: nrwl/nx-set-shas@v4

      - name: Show affected projects
        run: npx nx show projects --affected

      - run: npx nx affected -t lint test build --base=origin/master~5 --head=origin/master

      # - name: Run copy-project-json on affected projects
      #   run: npx nx affected -t copy-project-json --base=origin/master~5 --head=origin/master

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend Docker metadata
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/etsecure_backend

      - name: Extract frontend Docker metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/etsecure_frontend

      - name: Build affected projects
        run: npx nx affected -t docker-build --base=origin/master~1 --head=origin/master

      - name: Publish affected projects
        run: npx nx affected -t docker-publish --base=origin/master~1 --head=origin/master



