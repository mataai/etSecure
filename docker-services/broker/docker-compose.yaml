services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    environment:
      RABBITMQ_LOAD_DEFINITIONS: /etc/rabbitmq/definitions.json
    networks:
      - traefik
    ports:
      - '5672:5672'
      - '15672:15672'
      - '1883:1883'
      - '8883:8883'
      - '15692:15692'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.etsecure.xyz`)"
      - "traefik.http.routers.rabbitmq.entrypoints=https"
      - "traefik.http.routers.rabbitmq.tls.certresolver=production"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    volumes:
      - ./var-log:/var/log/rabbitmq
      - ./rabbitmq:/etc/rabbitmq/

networks:
  traefik:
    external: true
