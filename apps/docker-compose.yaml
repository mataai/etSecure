version: '3.9'

services:
  backend:
    image: ghcr.io/mataai/etsecure:latest
    container_name: etsecure-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  frontend:
    image: ghcr.io/mataai/frontend:latest
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped