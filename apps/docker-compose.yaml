version: '3.9'

services:
  backend:
    image: ghcr.io/mataai/etsecure_backend:latest
    container_name: etsecure_backend
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.etsecure.xyz`)"
      - "traefik.http.routers.backend.entrypoints=https"
      - "traefik.http.routers.backend.tls.certresolver=production"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  frontend:
    image: ghcr.io/mataai/etsecure_frontend:latest
    container_name: etsecure_frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`etsecure.xyz`)"
      - "traefik.http.routers.frontend.entrypoints=https"
      - "traefik.http.routers.frontend.tls.certresolver=production"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  traefik:
    external: true